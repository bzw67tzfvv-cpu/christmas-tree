<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#03070f" />
<meta name="description" content="有一束光，穿过冬夜，只为你而来。点开，收下这棵为你亮起的圣诞树。" />
<meta property="og:title" content="有一束光，为你而来" />
<meta property="og:description" content="点开，收下这棵为你亮起的圣诞树。" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<title>有一束光，为你而来</title>
<style>
  :root{
    --ink:#eaf3ff;
    --dim:rgba(214,232,255,.55);
    --line:rgba(180,214,255,.22);
    --glow:#8fd8ff;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#03070f;color:var(--ink)}
  body{font-family:var(--sans);user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation}

  #scene{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- 封面 ---------- */
  #landing{
    position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(120% 80% at 50% 42%, rgba(10,26,48,.55) 0%, rgba(3,7,15,.92) 62%, #03070f 100%);
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  #landing.hide{opacity:0;visibility:hidden;pointer-events:none}
  .hair{width:1px;height:9vh;background:linear-gradient(to bottom,transparent,var(--line),transparent);margin-bottom:6vh}
  .kicker{
    font-size:10.5px;letter-spacing:.42em;color:rgba(190,216,246,.5);
    text-transform:uppercase;margin-bottom:26px;padding-left:.42em;
  }
  .nameRow{display:flex;align-items:flex-end;justify-content:center;gap:12px;line-height:1}
  .to{font-family:var(--serif);font-style:italic;font-size:15px;color:rgba(190,216,246,.55);transform:translateY(-8px);letter-spacing:.12em}
  #mono{
    font-family:var(--serif);font-weight:300;font-size:clamp(54px,15vw,104px);
    letter-spacing:.05em;line-height:.94;color:#f4f9ff;
    text-shadow:0 0 42px rgba(143,216,255,.45),0 0 90px rgba(108,186,255,.22);
  }
  .tagline{margin-top:26px;font-size:13.5px;letter-spacing:.22em;color:var(--dim);font-weight:300}
  #enter{
    margin-top:52px;display:inline-flex;align-items:center;gap:14px;
    padding:15px 30px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(180,214,255,.34);background:rgba(120,180,255,.045);
    color:#e6f2ff;font-size:13.5px;letter-spacing:.26em;font-weight:300;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background .4s ease,border-color .4s ease,transform .4s ease,box-shadow .4s ease;
    animation:breathe 5.2s ease-in-out infinite;
  }
  #enter:hover{background:rgba(130,190,255,.11);border-color:rgba(190,224,255,.6);box-shadow:0 0 34px rgba(120,190,255,.22)}
  #enter:active{transform:scale(.975)}
  #enter .arw{transition:transform .4s ease}
  #enter:hover .arw{transform:translateX(5px)}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 rgba(120,190,255,0)}50%{box-shadow:0 0 30px rgba(120,190,255,.14)}}
  .sig{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));font-size:10.5px;letter-spacing:.32em;color:rgba(180,208,240,.32)}
  .corner{position:absolute;width:26px;height:26px;border:1px solid rgba(180,214,255,.16)}
  .c1{top:26px;left:26px;border-right:0;border-bottom:0}
  .c2{top:26px;right:26px;border-left:0;border-bottom:0}
  .c3{bottom:26px;left:26px;border-right:0;border-top:0}
  .c4{bottom:26px;right:26px;border-left:0;border-top:0}

  /* ---------- 场景文字 ---------- */
  #stage{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 2s ease}
  #stage.on{opacity:1}
  #wordmark{
    position:absolute;top:max(22px,env(safe-area-inset-top));left:24px;
    font-family:var(--serif);font-size:13px;letter-spacing:.5em;color:rgba(214,236,255,.72);
    display:flex;align-items:center;gap:10px;
  }
  #wordmark .dot{width:5px;height:5px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  #cap{
    position:absolute;left:0;right:0;bottom:max(64px,calc(env(safe-area-inset-bottom) + 52px));
    text-align:center;
  }
  #cap .big{
    font-family:var(--serif);font-size:clamp(13px,3.4vw,17px);letter-spacing:.46em;
    color:rgba(238,247,255,.9);text-indent:.46em;
    text-shadow:0 0 22px rgba(130,200,255,.55),0 0 60px rgba(90,160,240,.3);
  }
  #cap .sub{margin-top:12px;font-size:11.5px;letter-spacing:.3em;color:rgba(190,214,244,.5);text-indent:.3em}
  #hint{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;font-size:10.5px;letter-spacing:.26em;color:rgba(180,206,238,.3)}

  /* ---------- 控件 ---------- */
  #ctrl{
    position:fixed;right:16px;bottom:max(150px,calc(env(safe-area-inset-bottom) + 138px));
    z-index:20;display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity 1.4s ease .8s;
  }
  #ctrl.on{opacity:1}
  .btn{
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:1px solid rgba(180,214,255,.2);background:rgba(8,18,34,.42);color:rgba(214,234,255,.78);
    font-size:11px;letter-spacing:.02em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:all .3s ease;
  }
  .btn:hover{border-color:rgba(190,224,255,.55);color:#fff;box-shadow:0 0 20px rgba(120,190,255,.2)}
  .btn.off{opacity:.38}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  #audioHint{
    position:fixed;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom) + 84px));
    transform:translate(-50%,8px);z-index:26;padding:9px 17px;border-radius:999px;
    background:rgba(10,22,38,.78);border:1px solid rgba(160,200,245,.32);
    font-size:11.5px;letter-spacing:.16em;color:rgba(226,242,255,.92);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;
    opacity:0;visibility:hidden;transition:opacity .45s ease,transform .45s ease,visibility .45s;
  }
  #audioHint.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

  /* ---------- 信件 ---------- */
  #letter{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    padding:26px;background:rgba(2,6,12,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s ease;
  }
  #letter.on{opacity:1;visibility:visible}
  .card{
    position:relative;width:min(430px,100%);max-height:78vh;overflow:auto;
    padding:38px 30px 34px;border-radius:18px;
    background:linear-gradient(165deg,rgba(12,24,42,.985),rgba(6,11,20,.995));
    border:1px solid rgba(160,200,245,.18);
    box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    transform:translateY(14px) scale(.985);transition:transform .7s cubic-bezier(.2,.8,.2,1);
  }
  #letter.on .card{transform:none}
  .card h2{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.24em;color:#eef6ff;margin-bottom:22px}
  .card h2::after{content:"";display:block;width:34px;height:1px;margin-top:14px;background:linear-gradient(to right,var(--glow),transparent)}
  .card p{font-size:13.5px;line-height:2.15;letter-spacing:.06em;color:rgba(214,232,252,.78);margin-bottom:15px;font-weight:300}
  .card .from{font-family:var(--serif);font-style:italic;text-align:right;font-size:13px;color:rgba(160,200,240,.6);margin-top:26px;margin-bottom:0}
  .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:rgba(200,222,248,.6);border:1px solid rgba(160,200,245,.14)}
  .close:hover{color:#fff;border-color:rgba(190,224,255,.5)}
  #openLetter{
    position:fixed;left:0;right:0;bottom:max(112px,calc(env(safe-area-inset-bottom) + 100px));
    z-index:20;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 1s ease;
  }
  #openLetter.on{opacity:1;visibility:visible}
  #openLetter span{
    display:inline-block;font-size:11px;letter-spacing:.3em;color:rgba(200,224,250,.62);
    border-bottom:1px solid rgba(160,200,245,.28);padding-bottom:6px;cursor:pointer;
  }
  #openLetter span:hover{color:#fff;border-color:rgba(190,224,255,.6)}
  @media (max-height:640px){
    .hair{height:6vh;margin-bottom:4vh}
    .tagline{margin-top:18px}
    #enter{margin-top:32px;padding:13px 26px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<audio id="bgm" src="music.mp3" loop preload="auto" playsinline webkit-playsinline x5-playsinline style="position:fixed;left:-4px;top:-4px;width:1px;height:1px;opacity:0;pointer-events:none"></audio>

<div id="stage">
  <div id="wordmark"><span class="dot"></span><span id="wmText">GYZ</span></div>
  <div id="cap">
    <div class="big" id="capBig">MERRY CHRISTMAS</div>
    <div class="sub" id="capSub">愿你被这世界温柔照亮</div>
  </div>
  <div id="hint">轻触画面，让雪落下</div>
</div>

<div id="audioHint"><span>&#9834; 点这里开启音乐</span></div>

<div id="openLetter"><span id="openLetterBtn">写给你的一封信</span></div>

<div id="ctrl">
  <div class="btn" id="btnSnow" title="雪">
    <svg viewBox="0 0 24 24"><path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11M12 6l-2.5-2M12 6l2.5-2M12 18l-2.5 2M12 18l2.5 2"/></svg>
  </div>
  <div class="btn" id="btnRot" title="旋转">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v4h-4"/></svg>
  </div>
  <div class="btn off" id="btnMusic" title="音乐">
    <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="19" cy="16" r="2.6"/></svg>
  </div>
  <div class="btn" id="btnFull" title="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </div>
</div>

<div id="landing">
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <div class="hair"></div>
  <div class="kicker" id="kicker">A LITTLE LIGHT FOR YOU &nbsp;2026</div>
  <div class="nameRow"><span class="to">to</span><span id="mono">GYZ</span></div>
  <div class="tagline" id="tagline">有一束光，穿过冬夜，只为你而来</div>
  <div id="enter"><span id="enterLabel">进入圣诞夜</span><span class="arw">→</span></div>
  <div class="sig" id="sig">FOR YOU · 2026</div>
</div>

<div id="letter">
  <div class="card">
    <div class="close" id="closeLetter">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <h2 id="letterTitle">写给你的一封信</h2>
    <div id="letterBody"></div>
    <p class="from" id="letterFrom">—— 我</p>
  </div>
</div>

<script>
/* =========================================================
   配置区：改这里就能改名字和文案（也可以直接用网址参数 ?to=xxx）
   ========================================================= */
const CONFIG = {
  to: "GYZ",
  from: "我",
  pageTitle: "有一束光，为你而来",
  kicker: "A LITTLE LIGHT FOR YOU",
  tagline: "有一束光，穿过冬夜，只为你而来",
  enter: "进入圣诞夜",
  greeting: "MERRY CHRISTMAS",
  wish: "愿你被这世界温柔照亮",
  letterTitle: "写给你的一封信",
  letter: [
    "今年冬天来得有点早，风一吹，街上的灯就亮了。",
    "我把一整棵树的光都攒了起来——每一根线，每一粒雪，都是想对你说、又没说出口的话。",
    "不用回信。你只要站在这里，安安静静地被照亮一会儿，就够了。",
    "圣诞快乐。新的一年，也请继续做那个让我一眼就认出来的人。"
  ]
};
try {
  const q = new URLSearchParams(location.search);
  if (q.get("to")) CONFIG.to = q.get("to").slice(0, 12);
  if (q.get("from")) CONFIG.from = q.get("from").slice(0, 12);
} catch (e) {}
const YEAR = 2026;

/* ---------------- 文本注入 ---------------- */
const $ = (id) => document.getElementById(id);
$("mono").textContent = CONFIG.to;
$("wmText").textContent = CONFIG.to.toUpperCase();
$("kicker").textContent = CONFIG.kicker + "\u00a0\u00a0" + YEAR;
$("tagline").textContent = CONFIG.tagline;
$("enterLabel").textContent = CONFIG.enter;
$("capBig").textContent = CONFIG.greeting;
$("capSub").textContent = CONFIG.wish;
$("sig").textContent = "FOR " + CONFIG.to.toUpperCase() + " · " + YEAR;
document.title = CONFIG.pageTitle;

/* =========================================================
   场景
   ========================================================= */
const canvas = $("scene");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1, CX = 0;

const state = {
  t: 0,                 // 秒
  entered: false,
  grow: 0,              // 0..1 树的生长
  rot: 0,
  rotating: true,
  snowOn: true,
  shake: 0
};

let stars = [], snow = [], strands = [], orns = [], rays = [], dust = [];
let bgLayer = null;

const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

/* ---------- 布局 ---------- */
function layout() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2;

  const landscape = W > H * 1.05;
  const topY = H * (landscape ? 0.14 : 0.185);
  const botY = H * (landscape ? 0.79 : 0.775);
  const baseR = Math.min(W * (landscape ? 0.225 : 0.43), (botY - topY) * (landscape ? 0.50 : 0.60));

  buildTree(topY, botY, baseR);
  buildStars();
  buildSnow();
  buildBackdrop(topY, botY, baseR);
}

/* ---------- 圣诞树：螺旋光丝 ---------- */
function buildTree(topY, botY, baseR) {
  strands = []; orns = []; rays = [];
  const N = 124;                // 光丝数量
  const SEG = 160;              // 每根采样点
  for (let i = 0; i < N; i++) {
    const phase = (i / N) * TAU * 2.4 + rnd(-0.10, 0.10);
    const turns = rnd(1.35, 2.45);
    const wob = rnd(0.6, 1.5);
    const pts = [];
    const tEnd = rnd(0.935, 1.0);
    const rj = rnd(0.93, 1.045);
    for (let s = 0; s <= SEG; s++) {
      const t = (s / SEG) * tEnd;
      const y = topY + (botY - topY) * t;
      const prof = 0.035 + 0.965 * Math.pow(t, 0.78);
      const r = baseR * prof * rj * (1 + 0.028 * Math.sin(t * 9 + i * 0.7));
      const th = phase + t * TAU * turns + 0.10 * Math.sin(t * 4 + wob);
      pts.push({ y, r, th, t });
    }
    strands.push({
      pts,
      alpha: rnd(0.10, 0.24),
      hue: rnd(186, 200),
      light: rnd(62, 80),
      width: rnd(0.5, 1.15)
    });
  }

  // 装饰球
  const scale = baseR / 220;
  const ORN = 152;
  for (let i = 0; i < ORN; i++) {
    const t = Math.pow(Math.random(), 0.68) * 0.982 + 0.014;
    const prof = 0.035 + 0.965 * Math.pow(t, 0.78);
    const kinds = ["orb", "orb", "orb", "orb", "orb", "spark", "spark", "bell", "star"];
    const kind = kinds[(Math.random() * kinds.length) | 0];
    const palette = [
      [200, 242, 255], [160, 216, 255], [255, 240, 200],
      [255, 208, 232], [198, 255, 246], [240, 248, 255]
    ];
    const c = palette[(Math.random() * palette.length) | 0];
    orns.push({
      t, th: Math.random() * TAU, r: baseR * prof,
      size: rnd(1.3, 3.2) * scale * (kind === "orb" ? 1 : kind === "bell" ? 0.62 : 1.05),
      color: c, kind,
      phase: Math.random() * TAU,
      speed: rnd(0.8, 2.2),
      bob: rnd(0.5, 1.8)
    });
  }

  // 顶星光芒
  for (let i = 0; i < 4; i++) rays.push({ a: Math.random() * TAU, len: rnd(0.5, 1), sp: rnd(-0.25, 0.25) });

  // 树内漂浮星尘
  dust = [];
  for (let i = 0; i < 70; i++) {
    dust.push({
      t: Math.random(), v: rnd(0.012, 0.045), rf: rnd(0.15, 0.92),
      th: Math.random() * TAU, r: rnd(0.5, 1.5) * (baseR / 220),
      ph: Math.random() * TAU, sp: rnd(0.6, 2.4)
    });
  }
  treeGeom = { topY, botY, baseR };
}
let treeGeom = { topY: 0, botY: 0, baseR: 0 };

/* ---------- 星空 ---------- */
function buildStars() {
  stars = [];
  const n = Math.round((W * H) / 9000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.95,
      r: rnd(0.25, 1.15),
      p: Math.random() * TAU,
      s: rnd(0.4, 1.6),
      big: Math.random() < 0.05
    });
  }
}

/* ---------- 雪 ---------- */
function buildSnow() {
  snow = [];
  const n = Math.min(230, Math.round((W * H) / 7000));
  for (let i = 0; i < n; i++) snow.push(newFlake(true));
}
function newFlake(init) {
  const z = rnd(0.25, 1);
  return {
    x: Math.random() * W,
    y: init ? Math.random() * H : -12,
    z,
    r: rnd(0.7, 2.5) * (0.55 + z * 0.9),
    vy: rnd(12, 34) * (0.45 + z),
    amp: rnd(6, 26),
    ph: Math.random() * TAU,
    sp: rnd(0.4, 1.3),
    a: rnd(0.18, 0.75) * (0.5 + z * 0.6)
  };
}

/* ---------- 背景层（静态缓存） ---------- */
function buildBackdrop(topY, botY, baseR) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(W)); c.height = Math.max(1, Math.round(H));
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#04070e");
  grd.addColorStop(0.42, "#061220");
  grd.addColorStop(1, "#020509");
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  const neb = (x, y, r, col, a) => {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${col},${a})`);
    rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  };
  neb(CX, topY + (botY - topY) * 0.18, Math.max(W, H) * 0.55, "40,110,175", 0.12);
  neb(CX, botY * 0.98, baseR * 2.4, "30,90,150", 0.16);
  neb(W * 0.14, H * 0.30, Math.max(W, H) * 0.34, "36,70,120", 0.10);
  neb(W * 0.88, H * 0.22, Math.max(W, H) * 0.30, "30,64,110", 0.08);

  // 地面光晕
  const gr = g.createRadialGradient(CX, botY + baseR * 0.06, 0, CX, botY + baseR * 0.06, baseR * 1.5);
  gr.addColorStop(0, "rgba(86,168,250,.13)");
  gr.addColorStop(0.5, "rgba(56,122,200,.05)");
  gr.addColorStop(1, "rgba(20,50,90,0)");
  g.fillStyle = gr;
  g.fillRect(0, botY - baseR * 1.4, W, baseR * 2.2);

  // 暗角
  const vg = g.createRadialGradient(CX, H * 0.46, Math.min(W, H) * 0.28, CX, H * 0.5, Math.max(W, H) * 0.82);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,.72)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  bgLayer = c;
}

/* ---------- 精灵缓存 ---------- */
const spriteCache = new Map();
function glowSprite(rgb, soft) {
  const key = rgb.join(",") + "|" + soft;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const S = 96;
  const c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d");
  const rg = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  rg.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`);
  rg.addColorStop(0.18, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${0.55 * soft})`);
  rg.addColorStop(0.45, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${0.14 * soft})`);
  rg.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
  g.fillStyle = rg; g.fillRect(0, 0, S, S);
  spriteCache.set(key, c);
  return c;
}

/* =========================================================
   绘制
   ========================================================= */
function drawStars() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(state.t * s.s + s.p);
    ctx.globalAlpha = (s.big ? 0.9 : 0.55) * tw;
    if (s.big) {
      const sp = glowSprite([210, 236, 255], 1);
      const r = s.r * 9;
      ctx.drawImage(sp, s.x - r, s.y - r, r * 2, r * 2);
    }
    ctx.fillStyle = "#dcecff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.7 + 0.3 * tw), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawTree() {
  const { topY, botY, baseR } = treeGeom;
  const g = state.grow;
  if (g <= 0.001) return;
  const ease = 1 - Math.pow(1 - g, 3);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  // 树的暗色本体：压住背后的星与光丝，形成实体感
  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  const bodyGrad = ctx.createLinearGradient(0, topY, 0, botY + baseR * 0.2);
  bodyGrad.addColorStop(0, `rgba(6,14,26,${0.72 * ease})`);
  bodyGrad.addColorStop(0.55, `rgba(5,12,23,${0.80 * ease})`);
  bodyGrad.addColorStop(0.82, `rgba(3,8,16,${0.86 * ease})`);
  bodyGrad.addColorStop(1, "rgba(3,8,16,0)");
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(CX, topY);
  ctx.lineTo(CX - baseR, botY);
  ctx.lineTo(CX - baseR, botY + baseR * 0.2);
  ctx.lineTo(CX + baseR, botY + baseR * 0.2);
  ctx.lineTo(CX + baseR, botY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 树的体积光（先铺一层氛围）
  const vol = ctx.createRadialGradient(CX, topY + (botY - topY) * 0.62, 0, CX, topY + (botY - topY) * 0.62, baseR * 1.55);
  vol.addColorStop(0, `rgba(56,150,230,${0.16 * ease})`);
  vol.addColorStop(0.42, `rgba(40,110,190,${0.075 * ease})`);
  vol.addColorStop(1, "rgba(16,50,100,0)");
  ctx.fillStyle = vol;
  ctx.fillRect(0, 0, W, H);

  // 光丝：软光 + 亮芯（共用纵向渐变，形成自然的光衰减）
  const gSoft = ctx.createLinearGradient(0, topY, 0, botY);
  gSoft.addColorStop(0, "rgba(198,236,255,0.16)");
  gSoft.addColorStop(0.30, "rgba(128,206,255,0.15)");
  gSoft.addColorStop(0.62, "rgba(96,176,244,0.12)");
  gSoft.addColorStop(0.86, "rgba(70,142,214,0.07)");
  gSoft.addColorStop(1, "rgba(50,110,180,0.03)");

  const gCore = ctx.createLinearGradient(0, topY, 0, botY);
  gCore.addColorStop(0, "rgba(232,248,255,0.42)");
  gCore.addColorStop(0.32, "rgba(176,226,255,0.44)");
  gCore.addColorStop(0.65, "rgba(132,200,255,0.36)");
  gCore.addColorStop(0.88, "rgba(104,176,240,0.24)");
  gCore.addColorStop(1, "rgba(80,146,210,0.12)");

  const paths = [];
  const CHUNKS = 6;
  for (const st of strands) {
    const pts = st.pts;
    const n = Math.min(pts.length - 1, Math.floor(ease * (pts.length - 1)));
    if (n < 4) continue;
    const per = Math.max(2, Math.ceil((n + 1) / CHUNKS));
    for (let c0 = 0; c0 <= n; c0 += per) {
      const c1 = Math.min(n, c0 + per);
      const p2 = new Path2D();
      let dsum = 0, cnt = 0;
      for (let i = c0; i <= c1; i++) {
        const p = pts[i];
        const th = p.th + state.rot;
        const s = Math.sin(th);
        const c = Math.cos(th);
        const depth = 1 + s * 0.10;
        const x = CX + p.r * c * depth;
        const y = p.y + s * p.r * 0.012;
        if (i === c0) p2.moveTo(x, y); else p2.lineTo(x, y);
        dsum += s; cnt++;
      }
      const d = dsum / cnt;           // -1 后 → 1 前
      const tm = pts[Math.min(n, Math.floor((c0 + c1) / 2))].t;
      const apex = Math.min(1, 0.30 + tm * 3.2);
      const baseFade = tm > 0.90 ? 1 - Math.min(1, (tm - 0.90) / 0.10) : 1;
      paths.push({ p2, st, f: (0.12 + 0.88 * (0.5 + 0.5 * d)) * apex * baseFade });
    }
  }

  ctx.lineCap = "round";
  if (!window.__lowQ) {
    for (const { p2, st, f } of paths) {
      if (f < 0.35) continue;
      ctx.globalAlpha = 0.45 * ease * f;
      ctx.strokeStyle = gSoft;
      ctx.lineWidth = st.width * 3.2;
      ctx.stroke(p2);
    }
  }
  ctx.globalAlpha = 1;
  for (const { p2, st, f } of paths) {
    ctx.globalAlpha = 0.35 + 0.65 * f;
    ctx.strokeStyle = gCore;
    ctx.lineWidth = st.width * (0.6 + 0.5 * f);
    ctx.stroke(p2);
  }
  ctx.globalAlpha = 1;

  // 环境星尘
  for (const d of dust) {
    const tt = (d.t + state.t * d.v) % 1;
    const y = botY - (botY - topY) * tt;
    const prof = 0.035 + 0.965 * Math.pow(1 - tt, 0.78);
    const th = d.th + state.rot * 0.7;
    const x = CX + baseR * prof * d.rf * Math.cos(th);
    const a = 0.25 + 0.6 * Math.abs(Math.sin(state.t * d.sp + d.ph));
    ctx.globalAlpha = a * ease * 0.75;
    ctx.fillStyle = "rgba(190,232,255,.95)";
    ctx.beginPath(); ctx.arc(x, y, d.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 装饰
  for (const o of orns) {
    if (o.t > ease) continue;
    const th = o.th + state.rot;
    const s = Math.sin(th);
    const c = Math.cos(th);
    const depth = 1 + s * 0.15;
    const x = CX + o.r * c * depth;
    const y = topY + (botY - topY) * o.t + s * o.r * 0.035;
    const tw = 0.5 + 0.5 * Math.abs(Math.sin(state.t * o.speed + o.phase));
    const vis = 0.4 + 0.6 * (0.5 + 0.5 * s);
    const size = o.size * (0.8 + 0.4 * (0.5 + 0.5 * s));
    const [r, gg, b] = o.color;
    const a = tw * vis * ease;

    if (o.kind === "orb") {
      const sp = glowSprite(o.color, 1);
      const R = size * 8;
      ctx.globalAlpha = a * 0.6;
      ctx.drawImage(sp, x - R, y - R, R * 2, R * 2);
      ctx.globalAlpha = a;
      ctx.fillStyle = `rgb(${r},${gg},${b})`;
      ctx.beginPath(); ctx.arc(x, y, size * 0.95, 0, TAU); ctx.fill();
      ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.beginPath(); ctx.arc(x, y, size * 0.40, 0, TAU); ctx.fill();
    } else if (o.kind === "spark") {
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = `rgba(${r},${gg},${b},.95)`;
      ctx.lineWidth = 1;
      const L = size * 3.4;
      ctx.beginPath();
      ctx.moveTo(x - L, y); ctx.lineTo(x + L, y);
      ctx.moveTo(x, y - L); ctx.lineTo(x, y + L);
      const d = L * 0.5;
      ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d);
      ctx.moveTo(x + d, y - d); ctx.lineTo(x - d, y + d);
      ctx.stroke();
      const sp = glowSprite(o.color, 1);
      ctx.globalAlpha = a * 0.55;
      ctx.drawImage(sp, x - size * 6, y - size * 6, size * 12, size * 12);
    } else if (o.kind === "bell") {
      const sp = glowSprite([255, 226, 168], 1);
      ctx.globalAlpha = a * 0.5;
      ctx.drawImage(sp, x - size * 6, y - size * 6, size * 12, size * 12);
      ctx.globalAlpha = a;
      ctx.fillStyle = `rgba(255,232,178,.95)`;
      ctx.beginPath();
      ctx.moveTo(x, y - size * 1.7);
      ctx.quadraticCurveTo(x + size * 1.6, y - size * 0.3, x + size * 1.2, y + size * 0.9);
      ctx.lineTo(x - size * 1.2, y + size * 0.9);
      ctx.quadraticCurveTo(x - size * 1.6, y - size * 0.3, x, y - size * 1.7);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(x, y + size * 1.02, size * 0.34, 0, TAU); ctx.fill();
    } else {
      const sp = glowSprite(o.color, 1);
      ctx.globalAlpha = a * 0.65;
      ctx.drawImage(sp, x - size * 7, y - size * 7, size * 14, size * 14);
      ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(255,255,255,.98)";
      ctx.beginPath();
      const R1 = size * 1.9, R2 = size * 0.4;
      for (let k = 0; k < 8; k++) {
        const ang = -Math.PI / 2 + (k * Math.PI) / 4;
        const rr = k % 2 ? R2 : R1;
        const px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawTopper(ease);
}

function drawTopper(ease) {
  const { topY, baseR } = treeGeom;
  const x = CX, y = topY - baseR * 0.085;
  const tw = 0.75 + 0.25 * Math.sin(state.t * 1.7);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  const sp = glowSprite([205, 240, 255], 1);
  ctx.globalAlpha = 0.95 * ease * tw;
  const R = baseR * 0.9;
  ctx.drawImage(sp, x - R, y - R, R * 2, R * 2);

  ctx.globalAlpha = 0.30 * ease;
  for (const r of rays) {
    const a = r.a + state.t * 0.10 + state.rot * 0.3;
    const L = baseR * 0.82 * r.len;
    const grd = ctx.createLinearGradient(x, y, x + Math.cos(a) * L, y + Math.sin(a) * L);
    grd.addColorStop(0, "rgba(226,246,255,.55)");
    grd.addColorStop(0.3, "rgba(170,220,255,.14)");
    grd.addColorStop(1, "rgba(150,210,255,0)");
    ctx.strokeStyle = grd; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); ctx.stroke();
  }

  const size = baseR * 0.098 * (0.92 + 0.08 * tw) * ease;
  ctx.globalAlpha = ease;
  const grd2 = ctx.createRadialGradient(x, y - size * 0.15, 0, x, y, size * 1.15);
  grd2.addColorStop(0, "rgba(255,255,255,1)");
  grd2.addColorStop(0.55, "rgba(226,246,255,.98)");
  grd2.addColorStop(1, "rgba(150,215,255,.85)");
  ctx.fillStyle = grd2;
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const ang = -Math.PI / 2 + (k * Math.PI) / 5;
    const rr = k % 2 ? size * 0.40 : size;
    const px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr;
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSnow(dt) {
  if (!state.snowOn) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const sp = glowSprite([232, 246, 255], 1);
  for (const f of snow) {
    f.y += f.vy * dt;
    f.ph += dt * f.sp;
    const x = f.x + Math.sin(f.ph) * f.amp;
    if (f.y > H + 12) { Object.assign(f, newFlake(false)); f.x = Math.random() * W; }
    if (f.z > 0.75) {
      const R = f.r * 4.2;
      ctx.globalAlpha = f.a * 0.4;
      ctx.drawImage(sp, x - R, f.y - R, R * 2, R * 2);
    }
    ctx.globalAlpha = f.a;
    ctx.fillStyle = "#f2faff";
    ctx.beginPath(); ctx.arc(x, f.y, f.r * 0.85, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* =========================================================
   主循环
   ========================================================= */
let last = performance.now();
let slowFrames = 0;
window.__lowQ = false;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.08) dt = 0.08;
  state.t += dt;

  // 自适应画质：连续掉帧就关掉柔光层，保证手机端流畅
  if (!window.__lowQ) {
    if (dt > 0.030) slowFrames++; else slowFrames = Math.max(0, slowFrames - 1);
    if (slowFrames > 45) window.__lowQ = true;
  }

  if (state.entered) state.grow = Math.min(1, state.grow + dt / 2.1);
  if (state.rotating) state.rot += dt * 0.19;

  ctx.save();
  if (bgLayer) ctx.drawImage(bgLayer, 0, 0, W, H);
  else { ctx.fillStyle = "#04070e"; ctx.fillRect(0, 0, W, H); }
  ctx.restore();

  drawStars();
  drawTree();
  drawSnow(dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =========================================================
   音乐：八音盒版 Jingle Bells
   1) 优先播放同目录的 music.mp3（微信 iOS 对真实音频文件最友好）
   2) 微信里用 WeixinJSBridgeReady + 首次触摸做“解锁”，再在点击时播放
   3) 万一 mp3 加载失败，现场离线合成一段 WAV 顶上
   ========================================================= */
const Music = (() => {
  const BPM = 92, BEAT = 60 / BPM;
  const MELODY = [
    [64,1],[64,1],[64,2], [64,1],[64,1],[64,2],
    [64,1],[67,1],[60,1.5],[62,0.5],[64,4],
    [65,1],[65,1],[65,1.5],[65,0.5], [65,1],[64,1],[64,1],[64,0.5],[64,0.5],
    [64,1],[62,1],[62,1],[64,1], [62,2],[67,2],
    [64,1],[64,1],[64,2], [64,1],[64,1],[64,2],
    [64,1],[67,1],[60,1.5],[62,0.5],[64,4],
    [65,1],[65,1],[65,1.5],[65,0.5], [65,1],[64,1],[64,1],[64,0.5],[64,0.5],
    [67,1],[67,1],[65,1],[62,1], [60,4],[0,1]
  ];

  const el = document.getElementById("bgm");
  let playing = false, primed = false, fallbackDone = false;
  // 兜底：实时合成
  let actx = null, master = null, timer = null, nextNote = 0, idx = 0, synthOn = false;

  const hintEl = () => document.getElementById("audioHint");
  function showHint() { const h = hintEl(); if (h) h.classList.add("on"); }
  function hideHint() { const h = hintEl(); if (h) h.classList.remove("on"); }
  function markBtn(on) { const b = document.getElementById("btnMusic"); if (b) b.classList.toggle("off", !on); }

  /* iOS / 微信：先用静音播放“解锁”一次媒体元素，之后点击才能直接出声 */
  function prime() {
    if (!el || primed) return;
    primed = true;
    try {
      el.muted = true;
      const p = el.play();
      if (p && p.then) {
        p.then(() => {
          try { el.pause(); el.currentTime = 0; } catch (e) {}
          el.muted = false;
        }).catch(() => { el.muted = false; });
      } else {
        try { el.pause(); el.currentTime = 0; } catch (e) {}
        el.muted = false;
      }
    } catch (e) { el.muted = false; }
  }

  /* ---------- 兜底：mp3 加载失败时现场合成 WAV ---------- */
  async function render() {
    const SR = 22050;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return null;
    const dur = MELODY.reduce((s, n) => s + n[1], 0) * BEAT + 2.8;
    const oc = new OAC(1, Math.ceil(dur * SR), SR);
    const out = oc.createGain(); out.gain.value = 0.95;
    const lp = oc.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4800;
    out.connect(lp); lp.connect(oc.destination);
    const dly = oc.createDelay(1.0); dly.delayTime.value = 0.16;
    const fb = oc.createGain(); fb.gain.value = 0.16;
    const wet = oc.createGain(); wet.gain.value = 0.22;
    dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(out);
    let t = 0.06;
    for (const [midi, beats] of MELODY) {
      const d = beats * BEAT;
      if (midi > 0) {
        const f = 440 * Math.pow(2, (midi - 69) / 12);
        [[1, 0.30], [2.01, 0.075], [3.02, 0.028]].forEach(([mul, amp]) => {
          const o = oc.createOscillator(); o.type = "sine"; o.frequency.value = f * mul;
          const g = oc.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(amp, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0004, t + Math.max(0.5, d * 1.7));
          o.connect(g); g.connect(out); g.connect(dly);
          o.start(t); o.stop(t + Math.max(0.7, d * 1.9));
        });
      }
      t += d;
    }
    return oc.startRendering();
  }

  function encodeWav(buf) {
    const ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;
    const bytes = 44 + len * ch * 2;
    const ab = new ArrayBuffer(bytes), dv = new DataView(ab);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); dv.setUint32(4, bytes - 8, true); str(8, "WAVE");
    str(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true);
    dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true);
    str(36, "data"); dv.setUint32(40, len * ch * 2, true);
    let off = 44;
    const chans = [];
    for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
    for (let i = 0; i < len; i++) {
      for (let c = 0; c < ch; c++) {
        let s = Math.max(-1, Math.min(1, chans[c][i]));
        dv.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        off += 2;
      }
    }
    return ab;
  }

  async function makeFallback() {
    if (fallbackDone || !el) return;
    fallbackDone = true;
    try {
      const buf = await render();
      if (!buf) return;
      const wav = new Blob([encodeWav(buf)], { type: "audio/wav" });
      el.src = URL.createObjectURL(wav);
      el.load();
      if (playing) { const p = el.play(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  }

  /* ---------- 兜底：Web Audio 实时合成 ---------- */
  function synthInit() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0;
    const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5000;
    master.connect(lp); lp.connect(actx.destination);
    return true;
  }
  function synthTone(midi, when, dur, gain) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const o = actx.createOscillator(), o2 = actx.createOscillator();
    const g = actx.createGain(), g2 = actx.createGain();
    o.type = "sine"; o2.type = "triangle";
    o.frequency.value = f; o2.frequency.value = f * 2.005;
    g2.gain.value = 0.16;
    o2.connect(g2); g2.connect(g); o.connect(g);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(gain, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0006, when + Math.max(0.4, dur * 1.6));
    g.connect(master);
    o.start(when); o2.start(when);
    o.stop(when + dur * 1.9 + 0.2); o2.stop(when + dur * 1.9 + 0.2);
  }
  function synthSchedule() {
    if (!synthOn) return;
    const ahead = actx.currentTime + 0.5;
    while (nextNote < ahead) {
      const [midi, beats] = MELODY[idx];
      const dur = beats * BEAT;
      if (midi > 0) synthTone(midi, nextNote, dur * 0.9, 0.13);
      nextNote += dur;
      idx = (idx + 1) % MELODY.length;
      if (idx === 0) nextNote += 0.6;
    }
  }
  function synthStart() {
    if (synthOn) return;
    if (!actx && !synthInit()) return;
    if (actx.state === "suspended") actx.resume();
    synthOn = true;
    nextNote = actx.currentTime + 0.12; idx = 0;
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(master.gain.value, actx.currentTime);
    master.gain.linearRampToValueAtTime(0.5, actx.currentTime + 2.0);
    clearInterval(timer); timer = setInterval(synthSchedule, 90);
    synthSchedule();
  }
  function synthStop() {
    if (!actx) return;
    synthOn = false;
    clearInterval(timer);
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(master.gain.value, actx.currentTime);
    master.gain.linearRampToValueAtTime(0, actx.currentTime + 0.8);
  }

  if (el) {
    el.addEventListener("error", makeFallback);
    el.addEventListener("stalled", () => { if (playing) makeFallback(); });
    el.addEventListener("ended", () => {
      if (!playing) return;
      try { el.currentTime = 0; const p = el.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    });
  }

  function start() {
    if (!el) { synthStart(); markBtn(true); return; }
    if (playing && !el.paused) return;
    el.muted = false;
    playing = true;
    const p = el.play();
    if (p && p.catch) {
      p.catch(() => {
        playing = false;
        synthStart();          // 有些内核 WebAudio 能出声
        if (!synthOn) showHint();
      });
    }
    markBtn(true);
    // 兜底检测：确实没在走就提示
    setTimeout(() => {
      if (playing && el.paused) { playing = false; showHint(); }
    }, 1500);
    hideHint();
  }

  return {
    prime,
    start,
    stop() {
      playing = false;
      if (el) { try { el.pause(); } catch (e) {} }
      if (synthOn) synthStop();
      markBtn(false);
    },
    resume() {
      if (playing && el && el.paused) { const p = el.play(); if (p && p.catch) p.catch(() => {}); }
      if (playing && synthOn && actx && actx.state === "suspended") actx.resume();
    },
    get playing() { return playing; },
    get usingSynth() { return synthOn; }
  };
})();

/* 微信：JSBridge 就绪和第一次触摸时各解锁一次 */
if (window.WeixinJSBridge) { try { Music.prime(); } catch (e) {} }
document.addEventListener("WeixinJSBridgeReady", () => { try { Music.prime(); } catch (e) {} }, false);
document.addEventListener("touchstart", () => { try { Music.prime(); } catch (e) {} }, { once: true, passive: true });
document.addEventListener("click", () => { try { Music.prime(); } catch (e) {} }, { once: true });
setTimeout(() => { try { Music.prime(); } catch (e) {} }, 900);

/* =========================================================
   交互
   ========================================================= */
const landing = $("landing"), stage = $("stage"), ctrl = $("ctrl"), openLetter = $("openLetter");

function enter() {
  if (state.entered) return;
  state.entered = true;
  landing.classList.add("hide");
  stage.classList.add("on");
  ctrl.classList.add("on");
  setTimeout(() => openLetter.classList.add("on"), 5200);
  try { Music.start(); $("btnMusic").classList.remove("off"); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(8);
}
$("enter").addEventListener("click", enter);
landing.addEventListener("click", (e) => { if (e.target === landing) enter(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { if (!state.entered) enter(); }
});

$("btnSnow").addEventListener("click", (e) => {
  e.stopPropagation();
  state.snowOn = !state.snowOn;
  e.currentTarget.classList.toggle("off", !state.snowOn);
});
$("btnRot").addEventListener("click", (e) => {
  e.stopPropagation();
  state.rotating = !state.rotating;
  e.currentTarget.classList.toggle("off", !state.rotating);
});
$("btnMusic").addEventListener("click", (e) => {
  e.stopPropagation();
  if (Music.playing) { Music.stop(); e.currentTarget.classList.add("off"); }
  else { Music.start(); e.currentTarget.classList.remove("off"); }
});
$("btnFull").addEventListener("click", (e) => {
  e.stopPropagation();
  const d = document.documentElement;
  if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d);
  else (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
});

/* 信件 */
const L = $("letter");
$("letterTitle").textContent = CONFIG.letterTitle;
$("letterFrom").textContent = "—— " + CONFIG.from;
$("letterBody").innerHTML = CONFIG.letter.map(p => "<p>" + p + "</p>").join("");
$("openLetterBtn").addEventListener("click", () => {
  L.classList.add("on");
  const ps = [...L.querySelectorAll("p")];
  ps.forEach(p => { p.style.opacity = 0; p.style.transform = "translateY(8px)"; p.style.transition = "opacity .9s ease, transform .9s ease"; });
  ps.forEach((p, i) => setTimeout(() => { p.style.opacity = 1; p.style.transform = "none"; }, 160 + i * 320));
});
$("closeLetter").addEventListener("click", () => L.classList.remove("on"));
L.addEventListener("click", (e) => { if (e.target === L) L.classList.remove("on"); });

/* 轻触画面：飘一阵雪 + 一点风 */
canvas.addEventListener("pointerdown", () => {
  if (!state.entered) return;
  for (let i = 0; i < 22; i++) {
    const f = newFlake(false);
    f.x = Math.random() * W; f.y = rnd(-40, H * 0.35); f.z = rnd(0.6, 1);
    f.vy = rnd(40, 95); f.r = rnd(1.2, 3.2); f.a = rnd(0.35, 0.85);
    snow.push(f);
  }
});

window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(layout, 180); });
document.addEventListener("visibilitychange", () => {
  last = performance.now();
  if (document.visibilityState === "visible") { try { Music.resume(); } catch (e) {} }
});

/* 首次布局 */
layout();
if (typeof CONFIG_SHOT !== "undefined") {}
/* 截图模式：?shot=1 或 #shot 直接进入场景 */
try {
  const hs = (location.hash || "").slice(1);
  const q = new URLSearchParams(location.search + (hs ? "&" + hs : ""));
  if (q.get("shot") || hs === "shot") {
    const lp = document.getElementById("landing");
    lp.style.transition = "none";
    lp.style.display = "none";
    state.entered = true;
    state.grow = 0.999;
    stage.classList.add("on"); ctrl.classList.add("on");
    if (q.get("letter")) { setTimeout(() => $("openLetterBtn").click(), 60); }
  }
} catch (e) {}
</script>
